name: Build Flutter App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Build Docker image once and push to GHCR for reuse
  build-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}/builder
        tags: |
          type=sha,prefix=sha-

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile.build
        build-args: |
          USER_ID=1000
          GROUP_ID=1000
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/builder:buildcache
        cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/builder:buildcache,mode=max

  build-android-debug:
    needs: build-docker
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Pull pre-built Docker image
      run: |
        docker pull ${{ needs.build-docker.outputs.image-tag }}
        docker tag ${{ needs.build-docker.outputs.image-tag }} repertoire-coach-builder

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Cache Flutter pub
      uses: actions/cache@v4
      with:
        path: |
          ~/.pub-cache
        key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
        restore-keys: |
          ${{ runner.os }}-pub-

    - name: Decode keystore
      run: |
        echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/upload-keystore.jks

    - name: Create key.properties
      run: |
        cat > android/key.properties <<EOF
        storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
        keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
        storeFile=../upload-keystore.jks
        EOF

    - name: Build Android APK (Debug)
      run: |
        mkdir -p $HOME/.gradle $HOME/.pub-cache .cache/.android
        docker run --rm \
          -u $(id -u):$(id -g) \
          -e HOME=/workspace/.cache \
          -e ANDROID_USER_HOME=/workspace/.cache \
          -v $(pwd):/workspace \
          -v $HOME/.gradle:/workspace/.cache/.gradle \
          -v $HOME/.pub-cache:/workspace/.cache/.pub-cache \
          -w /workspace \
          repertoire-coach-builder \
          sh -c "git config --global --add safe.directory /opt/flutter && flutter build apk --debug --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}"

    - name: Upload Debug APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-debug-apk
        path: build/app/outputs/flutter-apk/app-debug.apk
        retention-days: 7

    - name: Publish debug APK as "latest" GitHub Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: Latest Debug Build
        body: |
          Debug APK built from `${{ github.sha }}` on ${{ github.event.head_commit.message }}

          **Install on Android:**
          1. Download `app-debug.apk` below
          2. Enable *Install unknown apps* for your browser / file manager
          3. Tap the downloaded file to install
        files: build/app/outputs/flutter-apk/app-debug.apk
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android-release:
    needs: build-docker
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Pull pre-built Docker image
      run: |
        docker pull ${{ needs.build-docker.outputs.image-tag }}
        docker tag ${{ needs.build-docker.outputs.image-tag }} repertoire-coach-builder

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Cache Flutter pub
      uses: actions/cache@v4
      with:
        path: |
          ~/.pub-cache
        key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
        restore-keys: |
          ${{ runner.os }}-pub-

    - name: Decode keystore
      run: |
        echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/upload-keystore.jks

    - name: Create key.properties
      run: |
        cat > android/key.properties <<EOF
        storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
        keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
        storeFile=../upload-keystore.jks
        EOF
        
    - name: Build Android APK (Release)
      run: |
        mkdir -p $HOME/.gradle $HOME/.pub-cache .cache/.android
        docker run --rm \
          -u $(id -u):$(id -g) \
          -e HOME=/workspace/.cache \
          -e ANDROID_USER_HOME=/workspace/.cache \
          -v $(pwd):/workspace \
          -v $HOME/.gradle:/workspace/.cache/.gradle \
          -v $HOME/.pub-cache:/workspace/.cache/.pub-cache \
          -w /workspace \
          repertoire-coach-builder \
          sh -c "git config --global --add safe.directory /opt/flutter && flutter build apk --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}"

    - name: Upload Release APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
        retention-days: 30

  build-web:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Web version
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      run: ./scripts/build-web.sh

    - name: Upload Web artifact
      uses: actions/upload-artifact@v4
      with:
        name: web-build
        path: build/web/
        retention-days: 7

  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.38.3'
        channel: 'stable'
        cache: true

    - name: Install dependencies
      run: flutter pub get

    - name: Build iOS app (Debug)
      run: flutter build ios --debug --no-codesign --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

    - name: Upload iOS Debug artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-debug-app
        path: build/ios/iphoneos/Runner.app
        retention-days: 7

    - name: Build iOS app (Release)
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: flutter build ios --release --no-codesign --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

    - name: Upload iOS Release artifact
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v4
      with:
        name: ios-release-app
        path: build/ios/iphoneos/Runner.app
        retention-days: 30

  analyze:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Flutter analyze
      run: ./scripts/analyze.sh

    - name: Run Flutter tests
      run: ./scripts/test.sh

    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: analyze-test-logs
        path: logs/
        retention-days: 7

  coverage:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Generate coverage report
      run: ./scripts/coverage.sh

    - name: Parse coverage and create summary
      run: |
        # Extract coverage statistics from lcov.info
        TOTAL_LINES=$(grep -o "LF:[0-9]*" coverage/lcov.info | cut -d: -f2 | awk '{s+=$1} END {print s}')
        COVERED_LINES=$(grep -o "LH:[0-9]*" coverage/lcov.info | cut -d: -f2 | awk '{s+=$1} END {print s}')
        COVERAGE_PCT=$(awk "BEGIN {printf \"%.1f\", ($COVERED_LINES / $TOTAL_LINES) * 100}")

        # Create GitHub Actions summary
        echo "## 📊 Test Coverage Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
        echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| **Coverage** | **${COVERAGE_PCT}%** |" >> $GITHUB_STEP_SUMMARY
        echo "| Lines Covered | ${COVERED_LINES} / ${TOTAL_LINES} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # Get test counts from log
        TEST_LOG=$(ls -t logs/coverage-*.log | head -1)
        if [ -f "$TEST_LOG" ]; then
          PASSED=$(grep -oP '\+\K[0-9]+(?= ~)' "$TEST_LOG" | tail -1)
          SKIPPED=$(grep -oP '~\K[0-9]+' "$TEST_LOG" | tail -1)
          echo "| Tests Passed | ${PASSED} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests Skipped | ${SKIPPED} |" >> $GITHUB_STEP_SUMMARY
        fi

        echo "" >> $GITHUB_STEP_SUMMARY

        # Add coverage badge color
        if [ $(echo "$COVERAGE_PCT >= 80" | bc) -eq 1 ]; then
          echo "✅ **Excellent coverage** (≥80%)" >> $GITHUB_STEP_SUMMARY
        elif [ $(echo "$COVERAGE_PCT >= 60" | bc) -eq 1 ]; then
          echo "⚠️ **Good coverage** (60-80%)" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Coverage needs improvement** (<60%)" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/
        retention-days: 30

    - name: Upload coverage logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-logs
        path: logs/coverage-*.log
        retention-days: 7
